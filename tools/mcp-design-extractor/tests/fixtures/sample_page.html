<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixture de Teste Controlada — Aurora CDP</title>
    <style>
        :root {
            --fixture-bg: #090a0f;
            --fixture-surface: rgba(22, 25, 34, 0.72);
            --fixture-text: #f3f4f6;
            --fixture-accent: #6366f1;
            --fixture-easing: cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fixturePulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        body {
            background-color: var(--fixture-bg);
            color: var(--fixture-text);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .sample-card {
            background: var(--fixture-surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            transition: transform 300ms var(--fixture-easing), border-color 300ms var(--fixture-easing);
            max-width: 400px;
        }

        .sample-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .sample-btn {
            background: #6366f1;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            transition: background-color 250ms var(--fixture-easing);
        }

        .sample-btn:hover {
            background-color: #4f46e5;
        }

        canvas {
            display: block;
            margin-top: 1rem;
            width: 200px;
            height: 100px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Fixture de Engenharia Reversa Visual</h1>
        <article class="sample-card">
            <h2>Componente Card</h2>
            <p>Este card testa a extração de tokens em :root, curvas cubic-bezier e sombras.</p>
            <button class="sample-btn" type="button">Botão Interativo</button>
        </article>

        <form toolname="test_tool" tooldescription="Ferramenta WebMCP de teste">
            <input type="text" name="param1" placeholder="Parâmetro WebMCP">
        </form>

        <canvas id="test-canvas"></canvas>
    </main>

    <script>
        // Inicializa um contexto WebGL com um Shader real para testar a interceptação
        const canvas = document.getElementById('test-canvas');
        if (canvas) {
            const gl = canvas.getContext('webgl');
            if (gl) {
                const vsSource = `
                    attribute vec4 aVertexPosition;
                    void main() {
                        gl_Position = aVertexPosition;
                    }
                `;
                const fsSource = `
                    precision mediump float;
                    uniform vec4 uColor;
                    void main() {
                        gl_FragColor = uColor;
                    }
                `;
                const vs = gl.createShader(gl.VERTEX_SHADER);
                gl.shaderSource(vs, vsSource);
                gl.compileShader(vs);

                const fs = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(fs, fsSource);
                gl.compileShader(fs);

                const program = gl.createProgram();
                gl.attachShader(program, vs);
                gl.attachShader(program, fs);
                gl.linkProgram(program);
                gl.getUniformLocation(program, 'uColor');
            }
        }
    </script>
</body>
</html>
