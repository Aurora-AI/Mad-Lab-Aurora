          - heading "It’s time to push back against the forces of stagnation. It’s time for change." [level=2] [ref=e40]
        - generic [ref=e41]:
          - generic [ref=e42]:
            - generic [ref=e43]:
              - heading "Chapter I" [level=2] [ref=e44]
              - paragraph [ref=e45]: Change is a curious thing.
              - paragraph [ref=e46]: Some people will tell you that change is impossible. That it should be resisted. That it goes against human nature.
              - paragraph [ref=e47]: But change isn’t optional. It happens all the time.
              - paragraph [ref=e48]: Day by day. Minute by minute. Second by second. Tirelessly replacing old with new.
              - paragraph [ref=e49]: In an oxymoronic sense, change is the only constant we have in life.
              - paragraph [ref=e50]: Change is the delta between today and tomorrow. It’s the discrepancy between who we are and who we want to be. The diff between the status quo and the future we desire.
              - paragraph [ref=e51]: Without change everything would remain the same. Ambitions would remain dreams and dreams would remain fantasies.
              - paragraph [ref=e52]: Change is inevitable, but it doesn’t happen automatically. There’s a voice of resistance that’s trying to hold it back.
            - figure:
              - generic:
                - generic: Change
              - generic:
                - generic:
                  - generic:
                    - generic: Change
                    - generic: Change
                    - generic: Change
          - generic [ref=e53]:
            - generic [ref=e54]:
              - heading "Chapter II" [level=2] [ref=e55]
              - paragraph [ref=e56]: That voice of resistance is always there.
              - paragraph [ref=e57]: It appears right after you wake up, commanding the muscles in your hand to hit the snooze button. It shows up late at night, trying to keep you from setting the alarm in the first place. It’s constantly in your head, continuously telling you that the status quo is good enough.
              - paragraph [ref=e58]: “Just do it tomorrow,” it whispers.
              - paragraph [ref=e59]: But tomorrow never comes.
              - paragraph [ref=e60]: What comes is stagnation. A futureless future that’s stuck in the past.
              - paragraph [ref=e61]: The voice of resistance is not just talking to you. Stagnation also happens on a collective level. It happens when change is systematically held back by the inertia of our own shared beliefs. When we become trapped in a dictatorless dystopia worshiping an imaginary “truth”.
              - paragraph [ref=e62]: We call this truth “the standard”, “the norm”, or “common sense”. We treat it like a law of physics that can’t be changed or broken. But the reality is that this truth is just a disguised version of the decaying status quo. It’s a made-up concept designed for a world that no longer exists. A cargo cult.
              - paragraph [ref=e63]: Breaking out of this prison of stagnation requires technological progress. It requires tools that allow us to communicate, collaborate and co-create.
              - paragraph [ref=e64]: In the world of today, most of these tools appear in the form of software, built upon a shared language we call code. They are spreadsheets, messaging clients, version control systems, text editors, and issue trackers.
              - paragraph [ref=e65]: These tools enable us to work together as teams, movements, states, and companies. They allow us to escape stagnation and collectively push for change.
              - paragraph [ref=e66]: But what happens when our tools for change become the things that hold us back?
            - figure:
              - generic:
                - generic: Stagnation
                - generic: Stagnation
                - generic: Stagnation
          - generic [ref=e67]:
            - generic [ref=e68]:
              - heading "Chapter III" [level=2] [ref=e69]
              - paragraph [ref=e70]: Reflect on the current state of your work and you’ll realize that things are not as they used to be.
              - paragraph [ref=e71]: Where did all these meetings come from?
              - paragraph [ref=e72]: When did everything become so incredibly slow?
              - paragraph [ref=e73]: What happened to shipping things fast and frequently?
              - paragraph [ref=e74]: Why does your issue tracker require you to fill 37 different drop-down menus?
              - paragraph [ref=e75]: What you are witnessing are the forces of stagnation. Slowly pouring sand in the gears of your once so nimble team. Steadily slowing you down to the point where you are unable to move.
              - paragraph [ref=e76]: The stasis of your team is a direct result of the stasis of your tools. Stagnation is invisible but you can feel its presence in the form of bloated user interfaces, loading spinners, and endless UX papercuts.
              - paragraph [ref=e77]: With decaying tools comes a decaying spirit. Complacency slowly creeps in. Ambition gradually fades away. What’s left is a quiet acceptance of the emptiness of your once so sparkling existence. Why choose change when the voice of resistance offers you a thousand paths of least resistance?
              - paragraph [ref=e78]: But stagnation never stops. It doesn’t magically disappear. Life doesn’t get better by chance. It only gets better by change. To rejuvenate your team you must rejuvenate your tools. To leave the status quo behind you must change your tools for change.
            - figure:
              - generic:
                - generic:
                  - text: Tools for
                  - text: Change
          - generic [ref=e79]:
            - generic [ref=e80]:
              - heading "Chapter IV" [level=2] [ref=e81]
              - paragraph [ref=e82]: Change is a curious thing.
              - paragraph [ref=e83]: Some people will tell you change is impossible. That it should be resisted. That it goes against human nature.
              - paragraph [ref=e84]: But change is inevitable. It’s the only certainty in life.
              - paragraph [ref=e85]: Change is the island of hope in the ocean of complacency. It’s your protection against the rising sea levels of stagnation. A lighthouse that’s guiding you to a better future.
              - paragraph [ref=e86]: The future it points to is one where you are free from the chores and chains of your old legacy tools. A future where your team is rejuvenated and ready to create truly magical things again.
              - paragraph [ref=e87]: That future is not an inconceivable dream, but simply a matter of time and choice. All it needs is a final gentle push.
              - paragraph [ref=e88]: The island of hope is right in front of you.
              - paragraph [ref=e89]: You have felt its shores before.
              - paragraph [ref=e90]: Last year you said next year.
              - paragraph [ref=e91]: It’s time for change.
            - figure:
              - generic:
