          - heading "Tokenization, but with a powerful and flexible encryption model" [level=2] [ref=e2049]
          - generic [ref=e2050]: Evervault’s encryption model is built different. We never store your data. Evervault stores the keys, you store data as you normally would — but fully encrypted.
        - generic [ref=e2051]:
          - generic [ref=e2052]:
            - generic [ref=e2053]:
              - img [ref=e2054]
              - text: Reduced risk of data breach
            - text: Evervault’s dual-custody model means a successful data breach would require both you and Evervault to be breached, compared to a single point of failure with traditional tokenization.
          - generic [ref=e2057]:
            - generic [ref=e2058]:
              - img [ref=e2059]
              - text: Improve Performance
            - text: Our model lets you create encrypted tokens without any network requests. This significantly reduces latency and means tokens can be encrypted in microseconds, not seconds.
          - generic [ref=e2062]:
